[package]
name = "kriyadot"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
# V-5 dictation (src/dictation.rs): global push-to-talk shortcut +
# OS-level text insertion. Source-level only until CI runs cargo check
# (no Rust toolchain on the build VM).
tauri-plugin-global-shortcut = "2"
enigo = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
image = "0.25"

[features]
# this feature is used for production builds or when `devUrl` is set to an external URL
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
