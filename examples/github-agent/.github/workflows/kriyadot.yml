# CA-22: copy this workflow into YOUR repo at .github/workflows/kriyadot.yml
# It forwards `/kriyadot …` issue/PR comments to your KriyaDot instance's
# webhook endpoint (apps/api/src/github-agent.ts). The instance verifies
# the HMAC signature, dispatches a governed routine run, and posts PR
# reviews only through its approval-gated GitHub path.
name: KriyaDot
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  kriyadot:
    if: contains(github.event.comment.body, '/kriyadot')
    runs-on: ubuntu-latest
    steps:
      - name: Forward comment to KriyaDot
        env:
          KRIYADOT_WEBHOOK_URL: ${{ secrets.KRIYADOT_WEBHOOK_URL }}
          KRIYADOT_WEBHOOK_SECRET: ${{ secrets.KRIYADOT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          payload=$(cat "$GITHUB_EVENT_PATH")
          sig=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$KRIYADOT_WEBHOOK_SECRET" | awk '{print $2}')
          curl -sS -X POST "$KRIYADOT_WEBHOOK_URL" \
            -H 'content-type: application/json' \
            -H "x-github-event: $GITHUB_EVENT_NAME" \
            -H "x-hub-signature-256: sha256=$sig" \
            --data-binary @"$GITHUB_EVENT_PATH"
