# SPDX-License-Identifier: Apache-2.0
# Release pipeline — triggered by pushing a tag like v0.1.0:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds the Tauri desktop app per OS (Windows .exe via NSIS, Linux AppImage + .deb)
# and the standalone mvp-server binary, then attaches everything to a DRAFT
# GitHub Release for review before publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach desktop artifacts to'
        required: true
        default: 'v0.1.0-alpha'

permissions:
  contents: write

jobs:
  server-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2

      - run: npm ci
      - run: bun install  # bun's bundler needs its own node_modules layout to resolve @mvp/* workspaces
      - run: bash scripts/build-server-binary.sh --target bun-linux-x64  # script runs npm run build internally

      - uses: actions/upload-artifact@v4
        with:
          name: mvp-server-linux-x64
          path: dist/mvp-server
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            sidecar-target: bun-linux-x64
            sidecar-name: mvp-api-x86_64-unknown-linux-gnu
          - os: windows-latest
            sidecar-target: bun-windows-x64
            sidecar-name: mvp-api-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci
      - run: bun install  # bun's bundler needs its own node_modules layout to resolve @mvp/* workspaces
      - run: npm run build  # workspace dist/ outputs (sidecar compile resolves @mvp/* via package main)

      - name: Compile API sidecar for this OS
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          bun build --compile --target=${{ matrix.sidecar-target }} \
            apps/api/src/index.ts \
            --outfile apps/desktop/src-tauri/binaries/${{ matrix.sidecar-name }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Sarviq ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            Desktop app installers (Windows .exe, Linux AppImage + .deb) and the
            standalone mvp-server binary. Alpha release — expect rough edges.
          releaseDraft: false
          prerelease: true

      # The linuxdeploy-built AppImage bundles the runner's libwebkit2gtk-4.1,
      # which is now Skia-based and crashes on some systems' COLRv1 color fonts
      # (window never opens). Strip the bundled WebKitGTK so the AppImage uses
      # the system libwebkit2gtk-4.1 like the .deb does, then re-upload.
      - name: Fix Linux AppImage (drop bundled WebKitGTK)
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APPIMAGE=$(ls apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          echo "Post-processing $APPIMAGE"
          work=$(mktemp -d)
          "$APPIMAGE" --appimage-extract >/dev/null
          mv squashfs-root "$work/appdir"
          rm -f "$work/appdir"/usr/lib/libwebkit2gtk-4.1.so* \
                "$work/appdir"/usr/lib/libjavascriptcoregtk-4.1.so*
          wget -q -O "$work/ait.AppImage" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$work/ait.AppImage"
          (cd "$work" && ./ait.AppImage --appimage-extract >/dev/null)
          export PATH="$work/squashfs-root/usr/bin:$PATH"
          APPNAME=$(basename "$APPIMAGE")
          "$work/squashfs-root/usr/bin/appimagetool" "$work/appdir" "$work/$APPNAME" >/dev/null
          # Replace the release asset with the fixed AppImage
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[] | select(.name | endswith(".AppImage")) | .id')
          if [ -n "$ASSET_ID" ]; then gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID"; fi
          gh release upload "$TAG" "$work/$APPNAME" --clobber
          rm -rf "$work" squashfs-root
