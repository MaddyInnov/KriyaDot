# SPDX-License-Identifier: Apache-2.0
name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android-companion/**'
      - 'android-phone-agent/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-companion/**'
      - 'android-phone-agent/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: android-companion
            artifact: kriyadot-companion-debug
          - project: android-phone-agent
            artifact: kriyadot-phone-agent-debug
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest runners ship the Android SDK preinstalled
      # (ANDROID_HOME/ANDROID_SDK_ROOT are preset) — no setup step needed.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platform-tools" | head -5
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null | grep -E "platforms;android-34|build-tools;34" | head -5 || true

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          build-root-directory: ${{ matrix.project }}
          arguments: :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.project }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
