# SECONDARY deployment path: hosted/server. The primary end-user distribution
# is the Tauri desktop app (see scripts/build-desktop.sh) — a real .exe/AppImage
# with its own built-in UI. This compose file is for running the platform as a
# server (browser opens the served UI) or for self-hosting.
services:
  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "4000"
      DATA_DIR: /data
      SEED_DIR: /app/seed
      WORKSPACE_DIR: ${WORKSPACE_DIR:-}
      KRIYADOT_PUBLIC_URL: ${KRIYADOT_PUBLIC_URL:-}
      SESSION_HISTORY_LIMIT: ${SESSION_HISTORY_LIMIT:-}
      PROVIDERS_FILE: ${PROVIDERS_FILE:-}
    volumes:
      - mvp-data:/data
    restart: unless-stopped

volumes:
  mvp-data:
